name: Model release

# Manual only, from dev. Downloads the model file a ModelManifest names, from its source at the
# pinned revision, checks size and SHA-256 against the manifest (tools/model_release.py) and
# uploads it with its licence, the manifest and SHA256SUMS as a workflow artifact.
#
# With draft_release, a second job (the only one with write access) creates a DRAFT release
# model-<model_id>. The Zairenkai app downloads the model from that release only when the user
# asks, and only after the maintainer publishes the draft. The model is never committed.
on:
  workflow_dispatch:
    inputs:
      manifest:
        description: ModelManifest to release
        type: string
        default: models/qwen2.5-0.5b-instruct-q4_0.json
      draft_release:
        description: Create a draft GitHub release (the maintainer publishes it)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: model-release
  cancel-in-progress: false

jobs:
  stage:
    name: fetch and check the model
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.urls.outputs.tag }}
    steps:
      - name: Require the dev branch
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != refs/heads/dev ]; then
            echo "::error::Model releases are made from dev only (ran on $REF)."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Release tool tests
        run: python3 -m unittest tests.test_model_release -v
      - name: URLs from the manifest
        id: urls
        env:
          MANIFEST: ${{ inputs.manifest }}
        run: |
          case "$MANIFEST" in models/*.json) ;; *) echo "::error::the manifest must be in models/"; exit 1 ;; esac
          python3 tools/model_release.py urls "$MANIFEST" >> "$GITHUB_OUTPUT"
      - name: Download from the pinned source
        env:
          MODEL_URL: ${{ steps.urls.outputs.model_url }}
          LICENSE_URL: ${{ steps.urls.outputs.license_url }}
        run: |
          mkdir -p download
          curl -fsSL --retry 3 --proto '=https' -o download/model.gguf "$MODEL_URL"
          curl -fsSL --retry 3 --proto '=https' -o download/LICENSE "$LICENSE_URL"
      - name: Check against the manifest and stage the assets
        env:
          MANIFEST: ${{ inputs.manifest }}
        run: |
          python3 tools/model_release.py stage "$MANIFEST" download/model.gguf download/LICENSE dist
          (cd dist && sha256sum -c SHA256SUMS)
          { echo "### ${{ steps.urls.outputs.tag }}"; echo '```'; cat dist/SHA256SUMS; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: model-release
          path: dist/
          if-no-files-found: error

  # Separate from the download so the write token never sits next to fetched files being checked.
  # Creates a draft only; publishing it is the maintainer's step.
  draft:
    name: draft GitHub release
    needs: [stage]
    if: ${{ inputs.draft_release }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: model-release
          path: dist
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          TAG: ${{ needs.stage.outputs.tag }}
        run: |
          case "$TAG" in model-[a-z0-9_]*) ;; *) echo "::error::bad tag $TAG"; exit 1 ;; esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::A release $TAG already exists. A new model needs a new manifest (model_id)."
            exit 1
          fi
          (cd dist && sha256sum -c SHA256SUMS)
          gh release create "$TAG" --draft --latest=false --target "$SHA" \
            --title "Model $TAG" --notes-file dist/notes.md \
            dist/*.gguf dist/*.LICENSE.txt dist/*.manifest.json dist/SHA256SUMS
          echo "Draft release $TAG created. Publish it on GitHub so the app can download the model." >> "$GITHUB_STEP_SUMMARY"
