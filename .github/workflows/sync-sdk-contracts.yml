name: Sync canonical SDK contracts

on:
  schedule:
    - cron: '15 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-sdk-contracts
  cancel-in-progress: false

jobs:
  propose:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dev
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install pinned JSON-schema validator
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --require-hashes -r requirements.lock
      - name: Validate sync helper and tests
        run: |
          python3 -m py_compile tools/sync_sdk_contracts.py
          .venv/bin/python -m unittest tests.test_sync_sdk_contracts -v
      - name: Refresh exact SDK commit and byte copies
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/sync_sdk_contracts.py
      - name: Regenerate grammar and run complete Engine CI checks
        run: |
          .venv/bin/python tools/gen_grammar.py
          .venv/bin/python tools/check_sdk_copies.py
          .venv/bin/python -m unittest discover -s tests -t . -v
          shellcheck tools/*.sh scripts/*.sh
      - name: Open or refresh SDK sync PR (never push directly to dev)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: automation/sync-canonical-sdk-contracts
        run: |
          if git diff --quiet -- contracts/sources.json contracts/sdk fixtures/replay registry/output.gbnf; then
            echo 'SDK source commit and all contract copies are already synchronized.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B "$BRANCH"
          git add contracts/sources.json contracts/sdk fixtures/replay registry/output.gbnf
          git commit -m 'build: sync canonical SDK contracts and fixtures'
          git push --force origin "HEAD:refs/heads/$BRANCH"
          if gh pr view "$BRANCH" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh pr edit "$BRANCH" --repo "$GH_REPO" --title 'build: sync canonical SDK contracts and fixtures' --body 'Updates Engine contract/fixture copies from the exact Zairenkai-Sdk dev SHA. Complete Engine CI must pass before merge.'
          else
            gh pr create --repo "$GH_REPO" --base dev --head "$BRANCH" --title 'build: sync canonical SDK contracts and fixtures' --body 'Updates Engine contract/fixture copies from the exact Zairenkai-Sdk dev SHA. Complete Engine CI must pass before merge.'
          fi
          gh workflow run ci.yml --repo "$GH_REPO" --ref "$BRANCH"
          for _ in $(seq 1 30); do
            run_id=$(gh run list --repo "$GH_REPO" --workflow ci.yml --branch "$BRANCH" --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId' 2>/dev/null || true)
            [ -n "$run_id" ] && [ "$run_id" != null ] && break
            sleep 2
          done
          [ -n "${run_id:-}" ] && [ "$run_id" != null ] || { echo 'Could not locate Engine CI run.' >&2; exit 1; }
          gh run watch "$run_id" --repo "$GH_REPO" --exit-status
